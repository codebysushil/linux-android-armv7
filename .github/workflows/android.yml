name: Build Android

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build-android:
    name: Android ${{ matrix.name }}

    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: arm64-v8a
            target: aarch64-linux-android

          - name: armeabi-v7a
            target: armv7-linux-androideabi

          - name: x86_64
            target: x86_64-linux-android

          - name: x86
            target: i686-linux-android

    steps:
      # ------------------------------------------------------
      # Checkout your GitHub package
      # ------------------------------------------------------

      - name: Checkout
        uses: actions/checkout@v4

      # ------------------------------------------------------
      # Rust
      # ------------------------------------------------------

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # ------------------------------------------------------
      # Android SDK + NDK
      # ------------------------------------------------------

      - name: Setup Android
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"
          sdkmanager "ndk;27.2.12479018"

      # ------------------------------------------------------
      # Configure Android NDK
      # ------------------------------------------------------

      - name: Configure Android environment
        shell: bash
        run: |
          NDK="$ANDROID_HOME/ndk/27.2.12479018"

          echo "ANDROID_NDK_ROOT=$NDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"

          echo "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_PATH"

      # ------------------------------------------------------
      # Configure Cargo linker
      # ------------------------------------------------------

      - name: Configure Cargo
        shell: bash
        run: |
          mkdir -p ~/.cargo

          NDK="$ANDROID_HOME/ndk/27.2.12479018"
          TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"

          case "${{ matrix.target }}" in

            aarch64-linux-android)
              LINKER="$TOOLCHAIN/aarch64-linux-android24-clang"
              ;;

            armv7-linux-androideabi)
              LINKER="$TOOLCHAIN/armv7a-linux-androideabi24-clang"
              ;;

            x86_64-linux-android)
              LINKER="$TOOLCHAIN/x86_64-linux-android24-clang"
              ;;

            i686-linux-android)
              LINKER="$TOOLCHAIN/i686-linux-android24-clang"
              ;;

            *)
              echo "Unsupported target"
              exit 1
              ;;
          esac

          cat > ~/.cargo/config.toml <<EOF
          [target.${{ matrix.target }}]
          linker = "$LINKER"
          EOF

          echo "Using linker:"
          cat ~/.cargo/config.toml

      # ------------------------------------------------------
      # Build
      # ------------------------------------------------------

      - name: Build
        run: |
          cargo build \
            --release \
            --locked \
            --target "${{ matrix.target }}"

      # ------------------------------------------------------
      # Verify binary
      # ------------------------------------------------------

      - name: Verify
        run: |
          file \
            "target/${{ matrix.target }}/release/hello-world"

      # ------------------------------------------------------
      # Prepare artifact
      # ------------------------------------------------------

      - name: Prepare artifact
        run: |
          mkdir -p dist/${{ matrix.name }}

          cp \
            "target/${{ matrix.target }}/release/hello-world" \
            "dist/${{ matrix.name }}/"

      # ------------------------------------------------------
      # Upload GitHub Actions artifact
      # ------------------------------------------------------

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-${{ matrix.name }}
          path: dist/${{ matrix.name }}/
